# ──────────────────────────────────────────────────────────────────────────────
# AssetFlow Backend CI
# Runs on every PR targeting main and every push to main.
# Steps: lint → format-check → test (against real Postgres 16)
# ──────────────────────────────────────────────────────────────────────────────
name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

# Cancel superseded runs on the same PR
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # ── App config (mirrors docker-compose for test parity) ──
  DATABASE_URL: "postgresql://assetflow:assetflow_ci@localhost:5432/assetflow_test"
  JWT_SECRET: "ci-test-secret-do-not-use-in-prod"
  JWT_EXPIRE_HOURS: "8"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Lint & Format Check  (fast, no DB needed)
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .
