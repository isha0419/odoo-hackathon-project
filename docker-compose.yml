# ──────────────────────────────────────────────────────────────────────────────
# AssetFlow — Root Compose File
# One command builds and starts the whole stack, migrated and seeded:
#   docker compose up -d --build
#
#   docker compose down              → stop (data persisted)
#   docker compose down -v           → stop + wipe DB (fresh start)
#   docker compose logs -f api       → tail API logs
#   docker compose exec api python -m app.seed.seed --reset  → force a clean re-seed
#
# After: GET http://localhost:8000/docs  → Swagger UI
#        http://localhost:5173          → Frontend
# ──────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16
    container_name: assetflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: assetflow
      POSTGRES_PASSWORD: assetflow
      POSTGRES_DB: assetflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetflow -d assetflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assetflow-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://assetflow:assetflow@postgres:5432/assetflow
      JWT_SECRET: change-me-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_HOURS: "8"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # Mount source for hot-reload during local dev
    volumes:
      - ./backend:/app
    # Override CMD to enable hot-reload in dev; remove for prod image.
    # Seeding is idempotent (get_or_create by natural key) so it's safe to run
    # on every boot - only the first run actually creates data.
    command: >
      sh -c "alembic upgrade head && python -m app.seed.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assetflow-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - api
    # Mount source for hot-reload during local dev; keep the image's own
    # node_modules (installed at build time) instead of the host's.
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
    driver: local
