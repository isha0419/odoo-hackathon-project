[project]
name = "assetflow-backend"
version = "0.1.0"
description = "AssetFlow — Enterprise Asset & Resource Management System"
requires-python = ">=3.11"

# ─── Ruff (linter + formatter) ───────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 120
src = ["app"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "T20",   # flake8-print (catch stray prints)
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # Depends() in function args is FastAPI convention
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ─── Pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-fail-under=0",       # start at 0, raise as coverage grows
]
markers = [
    "unit: unit tests (no DB)",
    "integration: integration tests (requires DB)",
]
