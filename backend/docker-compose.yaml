# ──────────────────────────────────────────────────────────────────────────────
# AssetFlow — Local Development Database
# Usage:
#   docker compose up -d          → start Postgres
#   docker compose down           → stop (data persisted in volume)
#   docker compose down -v        → stop + wipe data (fresh start)
# ──────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16
    container_name: assetflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: assetflow
      POSTGRES_PASSWORD: assetflow
      POSTGRES_DB: assetflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d   # auto-run init scripts on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetflow -d assetflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    driver: local
